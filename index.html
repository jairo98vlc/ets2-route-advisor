<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TruckSim GPS - ETS2 / ATS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: transparent; /* Transparente ideal para OBS Studio o fondos oscuros */
            color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Contenedor principal estilo TruckSim GPS */
        .trucksim-container {
            position: relative;
            width: 780px;
            height: 650px;
            background: #111111;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #222222;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
        }

        /* Cabecera superior tipo TruckSim GPS */
        .top-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 44px;
            background: rgba(18, 18, 18, 0.9);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            z-index: 10;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .next-turn-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            font-weight: 700;
            color: #ffcc00;
        }

        .game-clock {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        /* Área central del mapa Canvas */
        .map-viewport {
            position: relative;
            width: 100%;
            flex: 1;
            background-color: #161616;
            overflow: hidden;
        }

        canvas { display: block; width: 100%; height: 100%; }

        /* Widgets flotantes superiores izquierdos (Velocidad y Límite) */
        .speedometer-widget {
            position: absolute;
            top: 56px;
            left: 16px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .speed-box {
            background: rgba(25, 25, 25, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 4px 12px;
            text-align: center;
            min-width: 75px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .speed-val { font-size: 24px; font-weight: 800; line-height: 1; color: #ffffff; }
        .speed-unit { font-size: 10px; color: #aaaaaa; font-weight: 600; text-transform: uppercase; }

        .speed-limit-badge {
            width: 44px;
            height: 44px;
            background-color: #ffffff;
            border: 4px solid #e53935;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #000000;
            font-size: 17px;
            font-weight: 900;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* Panel inferior Route Advisor estilo TruckSim GPS */
        .bottom-advisor {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(15, 15, 15, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
            display: flex;
            flex-direction: column;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            color: #dddddd;
            gap: 4px;
        }

        .advisor-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cargo-text { color: #81c784; }
        .time-remaining { color: #ffb74d; }

        /* Aviso de estado de conexión */
        .connection-alert {
            position: absolute;
            top: 56px;
            right: 16px;
            background: rgba(220, 53, 69, 0.9);
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 600;
            z-index: 12;
            display: none;
        }
    </style>
</head>
<body>

    <div class="trucksim-container">
        <!-- Cabecera Superior: Indicador de Giro y Hora -->
        <div class="top-header">
            <div class="next-turn-container">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffcc00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                <span id="next-turn-text">Continuar en Autovía</span>
            </div>
            <div class="game-clock" id="game-time">Dom 12:40</div>
        </div>

        <div class="connection-alert" id="conn-alert">Desconectado de ETS2</div>

        <!-- Velocímetro y límite flotantes -->
        <div class="speedometer-widget">
            <div class="speed-box">
                <div class="speed-val" id="speed-val">0</div>
                <div class="speed-unit">km/h</div>
            </div>
            <div class="speed-limit-badge" id="speed-limit">90</div>
        </div>

        <!-- Lienzo del Mapa GPS 3D -->
        <div class="map-viewport">
            <canvas id="gps-canvas"></canvas>
        </div>

        <!-- Barra inferior de información de carga y ruta -->
        <div class="bottom-advisor">
            <div class="advisor-line">
                <span class="cargo-text" id="cargo-info">Carga: Sin Remolque</span>
                <span class="time-remaining">Restante: <span id="eta-time">-- h -- min</span></span>
            </div>
            <div class="advisor-line" style="border-top: 1px solid rgba(255,255,255,0.06); padding-top: 4px; font-size: 12px; color: #aaaaaa;">
                <span id="destination-info">Destino: --</span>
                <span>Distancia: <span id="eta-dist">0 km</span></span>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gps-canvas');
        const ctx = canvas.getContext('2d');

        const elTime = document.getElementById('game-time');
        const elSpeed = document.getElementById('speed-val');
        const elLimit = document.getElementById('speed-limit');
        const elCargo = document.getElementById('cargo-info');
        const elEtaTime = document.getElementById('eta-time');
        const elDestination = document.getElementById('destination-info');
        const elEtaDist = document.getElementById('eta-dist');
        const elAlert = document.getElementById('conn-alert');

        function resizeCanvas() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let currentPos = { x: 0, z: 0, heading: 0, speed: 0 };
        let targetPos = { x: 0, z: 0, heading: 0, speed: 0 };
        let telemetryData = {
            speed: 0,
            speedLimit: 90,
            time: "Dom 12:40",
            cargo: "Sin Remolque",
            destination: "Ninguno",
            distanceKm: 0,
            etaFormatted: "-- h -- min"
        };

        // Red de carreteras de simulación / mapa
        const roadSegments = generateRoads();

        function generateRoads() {
            const segments = [];
            const mainRoad = [];
            for (let i = -15000; i <= 15000; i += 30) {
                const x = Math.sin(i * 0.0009) * 280 + Math.cos(i * 0.0003) * 100;
                mainRoad.push({ x: x, z: i });
            }
            segments.push({ points: mainRoad, width: 44, color: '#e24300', shoulder: '#f3a000' });
            return segments;
        }

        async function fetchTelemetry() {
            try {
                const res = await fetch('http://localhost:31377/api/ets2/telemetry');
                if (!res.ok) throw new Error("HTTP Error");
                
                const data = await res.json();
                elAlert.style.display = 'none';

                if (data.truck) {
                    let rawSpeed = data.truck.speed !== undefined ? data.truck.speed : 0;
                    if (data.truck.speedKmh !== undefined) rawSpeed = data.truck.speedKmh / 3.6;
                    
                    targetPos.speed = Math.abs(Math.round(rawSpeed * 3.6));
                    telemetryData.speedLimit = Math.round(data.truck.speedLimit ? data.truck.speedLimit * 3.6 : 90);

                    let pX = 0, pZ = 0, head = 0;
                    if (data.truck.placement) {
                        pX = data.truck.placement.x || 0;
                        pZ = data.truck.placement.z || 0;
                        head = (data.truck.placement.heading || 0) * Math.PI * 2;
                    } else if (data.truck.position) {
                        pX = data.truck.position.x || 0;
                        pZ = data.truck.position.z || 0;
                    }
                    targetPos.x = pX;
                    targetPos.z = pZ;
                    targetPos.heading = head;
                }

                if (data.job) {
                    telemetryData.cargo = (data.job.cargoLoaded && data.job.cargo) ? data.job.cargo : "Viaje libre / Sin carga";
                    telemetryData.destination = data.job.destinationCity || "En ruta";
                }

                if (data.game && data.game.time) {
                    const d = new Date(data.game.time);
                    if (!isNaN(d.getTime())) {
                        const dias = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
                        telemetryData.time = `${dias[d.getUTCDay()]} ${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}`;
                    }
                }

                if (data.navigation) {
                    const distMeters = data.navigation.estimatedDistance || 0;
                    telemetryData.distanceKm = Math.round(distMeters / 1000);
                    const timeSecs = data.navigation.estimatedTime || 0;
                    const totalMins = Math.round(timeSecs / 60);
                    telemetryData.etaFormatted = `${Math.floor(totalMins / 60)} h ${totalMins % 60} min`;
                }

            } catch (err) {
                elAlert.style.display = 'block';
                
                // Modo simulación autónoma si se visualiza en navegador web estándar / GitHub Pages sin juego
                targetPos.speed = 85;
                targetPos.z -= targetPos.speed * 0.08;
                targetPos.x = Math.sin(targetPos.z * 0.0009) * 280 + Math.cos(targetPos.z * 0.0003) * 100;
                
                const nextZ = targetPos.z - 2;
                const nextX = Math.sin(nextZ * 0.0009) * 280 + Math.cos(nextZ * 0.0003) * 100;
                targetPos.heading = Math.atan2(nextX - targetPos.x, nextZ - targetPos.z);

                telemetryData.cargo = "Maquinaria Industrial (Demo)";
                telemetryData.destination = "Valencia";
                telemetryData.distanceKm = 940;
                telemetryData.etaFormatted = "11 h 15 min";
            }
        }

        setInterval(fetchTelemetry, 100);

        function render() {
            // Interpolación suave de posición y velocidad (Lerp)
            currentPos.x += (targetPos.x - currentPos.x) * 0.12;
            currentPos.z += (targetPos.z - currentPos.z) * 0.12;
            currentPos.speed += (targetPos.speed - currentPos.speed) * 0.2;
            
            let diffHead = targetPos.heading - currentPos.heading;
            while (diffHead < -Math.PI) diffHead += Math.PI * 2;
            while (diffHead > Math.PI) diffHead -= Math.PI * 2;
            currentPos.heading += diffHead * 0.12;

            // Actualizar elementos en pantalla
            elTime.innerText = telemetryData.time;
            elSpeed.innerText = Math.round(currentPos.speed);
            elLimit.innerText = telemetryData.speedLimit;
            elCargo.innerText = `Carga: ${telemetryData.cargo}`;
            elDestination.innerText = `Destino: ${telemetryData.destination}`;
            elEtaTime.innerText = telemetryData.etaFormatted;
            elEtaDist.innerText = `${telemetryData.distanceKm.toLocaleString('es-ES')} km`;

            ctx.fillStyle = '#141414';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height * 0.65;

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.scale(1, 0.43); // Perspectiva 3D idéntica a TruckSim GPS
            ctx.rotate(-currentPos.heading);
            ctx.translate(-currentPos.x, -currentPos.z);

            drawRoads();
            ctx.restore();

            drawTruckMarker(centerX, centerY);

            requestAnimationFrame(render);
        }

        function drawRoads() {
            roadSegments.forEach(seg => {
                if (seg.points.length < 2) return;

                if (seg.shoulder) {
                    ctx.beginPath();
                    ctx.strokeStyle = seg.shoulder;
                    ctx.lineWidth = seg.width + 16;
                    ctx.lineCap = 'round';
                    seg.points.forEach((pt, i) => i === 0 ? ctx.moveTo(pt.x, pt.z) : ctx.lineTo(pt.x, pt.z));
                    ctx.stroke();
                }

                ctx.beginPath();
                ctx.strokeStyle = seg.color;
                ctx.lineWidth = seg.width;
                ctx.lineCap = 'round';
                seg.points.forEach((pt, i) => i === 0 ? ctx.moveTo(pt.x, pt.z) : ctx.lineTo(pt.x, pt.z));
                ctx.stroke();

                // Flechas indicadoras de ruta verdes en la autovía
                for (let i = 10; i < seg.points.length - 10; i += 16) {
                    const p1 = seg.points[i];
                    const p2 = seg.points[i + 1];
                    const angle = Math.atan2(p2.z - p1.z, p2.x - p1.x);

                    ctx.save();
                    ctx.translate(p1.x, p1.z);
                    ctx.rotate(angle);
                    
                    ctx.fillStyle = '#00e640';
                    ctx.beginPath();
                    ctx.moveTo(12, 0);
                    ctx.lineTo(-9, -8);
                    ctx.lineTo(-4, 0);
                    ctx.lineTo(-9, 8);
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();
                }
            });
        }

        // Marcador del camión estilo TruckSim GPS (Silueta de tractora detallada)
        function drawTruckMarker(x, y) {
            ctx.save();
            ctx.translate(x, y);

            ctx.beginPath();
            ctx.ellipse(0, 4, 32, 45, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(0, 0, 36, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(30, 136, 229, 0.22)';
            ctx.fill();

            ctx.fillStyle = '#1e88e5';
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2.2;

            ctx.beginPath();
            ctx.roundRect(-18, -30, 36, 60, 7);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(-23, -22, 4, 13);
            ctx.fillRect(19, -22, 4, 13);

            ctx.fillStyle = '#90caf9';
            ctx.beginPath();
            ctx.roundRect(-14, -26, 28, 12, 3);
            ctx.fill();

            ctx.fillStyle = '#0d47a1';
            ctx.beginPath();
            ctx.roundRect(-13, -10, 26, 22, 3);
            ctx.fill();

            ctx.fillStyle = '#ffeb3b';
            ctx.fillRect(-16, -30, 5, 3);
            ctx.fillRect(11, -30, 5, 3);

            ctx.restore();
        }

        requestAnimationFrame(render);
    </script>
</body>
</html>
